<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-labelledby="t d">
  <title id="t">30 Qdrant tools across 7 groups</title>
  <desc id="d">The server's 30 database tools in seven groups: collections (6), points (7), vector search (4), payload (4), health (5), vectors (2) and index (2). Each tool is prefixed qdrant_db_ and dispatched through one handler.</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill:#e6ebf5; }
    .muted { fill:#8b96ad; } .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    @keyframes g0 { 0%,3.00% { opacity:0; transform:translateY(10px); } 7.00%,95% { opacity:1; transform:translateY(0); } 100% { opacity:0; } } .g0 { animation:g0 10.0s infinite; }
    @keyframes g1 { 0%,8.00% { opacity:0; transform:translateY(10px); } 12.00%,95% { opacity:1; transform:translateY(0); } 100% { opacity:0; } } .g1 { animation:g1 10.0s infinite; }
    @keyframes g2 { 0%,13.00% { opacity:0; transform:translateY(10px); } 17.00%,95% { opacity:1; transform:translateY(0); } 100% { opacity:0; } } .g2 { animation:g2 10.0s infinite; }
    @keyframes g3 { 0%,18.00% { opacity:0; transform:translateY(10px); } 22.00%,95% { opacity:1; transform:translateY(0); } 100% { opacity:0; } } .g3 { animation:g3 10.0s infinite; }
    @keyframes g4 { 0%,23.00% { opacity:0; transform:translateY(10px); } 27.00%,95% { opacity:1; transform:translateY(0); } 100% { opacity:0; } } .g4 { animation:g4 10.0s infinite; }
    @keyframes g5 { 0%,28.00% { opacity:0; transform:translateY(10px); } 32.00%,95% { opacity:1; transform:translateY(0); } 100% { opacity:0; } } .g5 { animation:g5 10.0s infinite; }
    @keyframes g6 { 0%,33.00% { opacity:0; transform:translateY(10px); } 37.00%,95% { opacity:1; transform:translateY(0); } 100% { opacity:0; } } .g6 { animation:g6 10.0s infinite; }
    @media (prefers-reduced-motion: reduce) { * { animation:none !important; } }
  </style>
  <rect width="960" height="480" rx="20" fill="#0f1420"/>
  <text x="30" y="52" font-size="28" font-weight="800">30 tools · 7 groups</text>
  <text x="30" y="78" font-size="15" class="muted">The full Qdrant Database API: collections, points, search, payload, health, vectors and index.</text>
  <text x="930" y="60" text-anchor="end" font-size="40" font-weight="800" style="fill:#dc244c">30</text>
  <text x="930" y="80" text-anchor="end" font-size="12" class="muted">database tools</text>
  <g class="g0"><rect x="30" y="132" width="216" height="156" rx="12" fill="#dc244c" fill-opacity=".08" stroke="#dc244c" stroke-opacity=".55"/><text x="44" y="158" font-size="14" font-weight="700">Collections</text><text x="232" y="159" text-anchor="end" font-size="17" font-weight="800" style="fill:#dc244c">6</text><text x="44" y="180" font-size="10.5" class="mono" style="fill:#dc244c">list</text><text x="44" y="195" font-size="10.5" class="mono" style="fill:#dc244c">get</text><text x="44" y="210" font-size="10.5" class="mono" style="fill:#dc244c">create</text><text x="44" y="225" font-size="10.5" class="mono" style="fill:#dc244c">delete</text><text x="44" y="240" font-size="10.5" class="mono" style="fill:#dc244c">update</text><text x="44" y="255" font-size="10.5" class="mono" style="fill:#dc244c">exists</text></g><g class="g1"><rect x="256" y="132" width="216" height="156" rx="12" fill="#ff5c8a" fill-opacity=".08" stroke="#ff5c8a" stroke-opacity=".55"/><text x="270" y="158" font-size="14" font-weight="700">Points</text><text x="458" y="159" text-anchor="end" font-size="17" font-weight="800" style="fill:#ff5c8a">7</text><text x="270" y="180" font-size="10.5" class="mono" style="fill:#ff5c8a">upsert</text><text x="270" y="195" font-size="10.5" class="mono" style="fill:#ff5c8a">get</text><text x="270" y="210" font-size="10.5" class="mono" style="fill:#ff5c8a">get_single</text><text x="270" y="225" font-size="10.5" class="mono" style="fill:#ff5c8a">delete</text><text x="270" y="240" font-size="10.5" class="mono" style="fill:#ff5c8a">count</text><text x="270" y="255" font-size="10.5" class="mono" style="fill:#ff5c8a">scroll</text><text x="270" y="270" font-size="10.5" class="mono" style="fill:#ff5c8a">batch</text></g><g class="g2"><rect x="482" y="132" width="216" height="156" rx="12" fill="#b58cff" fill-opacity=".08" stroke="#b58cff" stroke-opacity=".55"/><text x="496" y="158" font-size="14" font-weight="700">Vector search</text><text x="684" y="159" text-anchor="end" font-size="17" font-weight="800" style="fill:#b58cff">4</text><text x="496" y="180" font-size="10.5" class="mono" style="fill:#b58cff">search</text><text x="496" y="195" font-size="10.5" class="mono" style="fill:#b58cff">search_batch</text><text x="496" y="210" font-size="10.5" class="mono" style="fill:#b58cff">recommend</text><text x="496" y="225" font-size="10.5" class="mono" style="fill:#b58cff">recommend_batch</text></g><g class="g3"><rect x="708" y="132" width="216" height="156" rx="12" fill="#3ec7ff" fill-opacity=".08" stroke="#3ec7ff" stroke-opacity=".55"/><text x="722" y="158" font-size="14" font-weight="700">Payload</text><text x="910" y="159" text-anchor="end" font-size="17" font-weight="800" style="fill:#3ec7ff">4</text><text x="722" y="180" font-size="10.5" class="mono" style="fill:#3ec7ff">set</text><text x="722" y="195" font-size="10.5" class="mono" style="fill:#3ec7ff">overwrite</text><text x="722" y="210" font-size="10.5" class="mono" style="fill:#3ec7ff">delete</text><text x="722" y="225" font-size="10.5" class="mono" style="fill:#3ec7ff">clear</text></g><g class="g4"><rect x="30" y="300" width="216" height="156" rx="12" fill="#3ddc84" fill-opacity=".08" stroke="#3ddc84" stroke-opacity=".55"/><text x="44" y="326" font-size="14" font-weight="700">Health</text><text x="232" y="327" text-anchor="end" font-size="17" font-weight="800" style="fill:#3ddc84">5</text><text x="44" y="348" font-size="10.5" class="mono" style="fill:#3ddc84">root</text><text x="44" y="363" font-size="10.5" class="mono" style="fill:#3ddc84">check</text><text x="44" y="378" font-size="10.5" class="mono" style="fill:#3ddc84">liveness</text><text x="44" y="393" font-size="10.5" class="mono" style="fill:#3ddc84">readiness</text><text x="44" y="408" font-size="10.5" class="mono" style="fill:#3ddc84">metrics</text></g><g class="g5"><rect x="256" y="300" width="216" height="156" rx="12" fill="#ffb02e" fill-opacity=".08" stroke="#ffb02e" stroke-opacity=".55"/><text x="270" y="326" font-size="14" font-weight="700">Vectors</text><text x="458" y="327" text-anchor="end" font-size="17" font-weight="800" style="fill:#ffb02e">2</text><text x="270" y="348" font-size="10.5" class="mono" style="fill:#ffb02e">update</text><text x="270" y="363" font-size="10.5" class="mono" style="fill:#ffb02e">delete</text></g><g class="g6"><rect x="482" y="300" width="216" height="156" rx="12" fill="#f6821f" fill-opacity=".08" stroke="#f6821f" stroke-opacity=".55"/><text x="496" y="326" font-size="14" font-weight="700">Index</text><text x="684" y="327" text-anchor="end" font-size="17" font-weight="800" style="fill:#f6821f">2</text><text x="496" y="348" font-size="10.5" class="mono" style="fill:#f6821f">create</text><text x="496" y="363" font-size="10.5" class="mono" style="fill:#f6821f">delete</text></g>
  <text x="30" y="468" font-size="12" class="muted">Every tool is <tspan class="mono">qdrant_db_*</tspan> and routes through one dispatcher. Set <tspan class="mono">QDRANT_URL</tspan> + <tspan class="mono">QDRANT_API_KEY</tspan> to register them.</text>
</svg>
